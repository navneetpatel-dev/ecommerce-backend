name: Infra

# Static checks for infra/terraform. Uses mocked providers, so it needs no AWS
# credentials and never touches real infrastructure. `terraform apply` stays a
# deliberate, manual step (see DEPLOYMENT.md).

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Plan tests (mocked AWS)
        run: terraform test
