name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the CI database and test run only — not real credentials.
    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ecommerce_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      RAZORPAY_WEBHOOK_SECRET: ci-only-webhook-secret
      START_WORKERS_IN_API: 'false'
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # no-explicit-any is a warning capped at today's count (--max-warnings in the
      # lint script); lower the cap as old `any`s are removed.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Migrate and seed database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Test
        run: npm test
