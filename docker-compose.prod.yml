# Single-host production data stores (e.g. one EC2 box). The AWS setup in
# infra/terraform uses RDS + ElastiCache instead and does not need this file.
#
# Ports bind to 127.0.0.1 only: the API on the same host reaches them, the
# internet does not. Set in .env before `docker compose -f docker-compose.prod.yml up -d`:
#   DB_USER, DB_PASSWORD, DB_NAME, REDIS_PASSWORD
#   DB_SSL=false   (this Postgres has no TLS)
#   REDIS_URL=redis://:${REDIS_PASSWORD}@localhost:6379
name: ecommerce-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis-prod
    restart: always
    # AOF persistence so queued jobs survive a restart; noeviction because
    # BullMQ must never lose keys.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge
